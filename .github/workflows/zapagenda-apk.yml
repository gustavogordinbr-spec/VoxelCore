name: Build ZapAgenda v3 APK

on:
  push:
    branches:
      - zapagenda-build
    paths:
      - 'zapagenda_v3_payload/**'
      - '.github/workflows/zapagenda-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild ZapAgenda v3 project
        run: |
          cat zapagenda_v3_payload/part*.b64 | base64 --decode > ZapAgenda-v3-projeto.zip
          unzip -t ZapAgenda-v3-projeto.zip
          unzip -q -o ZapAgenda-v3-projeto.zip
          test -f ZapAgenda/settings.gradle
          test -f ZapAgenda/app/src/main/java/com/zapagenda/app/PuterBridge.java
          test -f ZapAgenda/app/src/main/java/com/zapagenda/app/WhatsAppReplyService.java
          test -f ZapAgenda/app/src/main/assets/puter_engine.html

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ZapAgenda
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapAgenda-v3-debug-apk
          path: ZapAgenda/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
