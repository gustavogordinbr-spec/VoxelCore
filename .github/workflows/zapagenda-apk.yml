name: Build ZapAgenda APK

on:
  push:
    branches:
      - zapagenda-build
    paths:
      - 'zapagenda_payload/**'
      - 'zapagenda_patch/**'
      - '.github/workflows/zapagenda-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild base project ZIP
        run: |
          cat zapagenda_payload/part*.b64 | base64 --decode > ZapAgenda-projeto.zip
          unzip -q -o ZapAgenda-projeto.zip
          test -f ZapAgenda/settings.gradle

      - name: Apply ZapAgenda v2 patch
        run: |
          JAVA_DIR='ZapAgenda/app/src/main/java/com/zapagenda/app'
          cp zapagenda_patch/MainActivity.java "$JAVA_DIR/MainActivity.java"
          cp zapagenda_patch/BotSettings.java "$JAVA_DIR/BotSettings.java"
          cp zapagenda_patch/AiClient.java "$JAVA_DIR/AiClient.java"
          cp zapagenda_patch/WhatsAppReplyService.java "$JAVA_DIR/WhatsAppReplyService.java"
          cp zapagenda_patch/AndroidManifest.xml ZapAgenda/app/src/main/AndroidManifest.xml
          cp zapagenda_patch/app-build.gradle ZapAgenda/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ZapAgenda
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapAgenda-v2-debug-apk
          path: ZapAgenda/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
