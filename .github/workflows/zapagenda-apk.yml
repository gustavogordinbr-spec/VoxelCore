name: Build ZapAgenda APK

on:
  push:
    branches:
      - zapagenda-build
    paths:
      - 'zapagenda_payload/**'
      - '.github/workflows/zapagenda-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project ZIP
        run: |
          cat zapagenda_payload/part*.b64 | base64 --decode > ZapAgenda-projeto.zip
          unzip -q -o ZapAgenda-projeto.zip
          test -f ZapAgenda/settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        working-directory: ZapAgenda
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapAgenda-debug-apk
          path: ZapAgenda/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
